pipeline:
  language: english
  target_audience: "supply chain professionals, operations managers, and logistics leaders interested in AI"
  content_tone: "insightful, forward-looking, and practical"

content:
  linkedin:
    max_chars: 3000
    recommended_chars: 1500
    include_emoji: true
    line_break_after_hook: true

research:
  max_sources: 10
  max_search_queries: 5
  preferred_source_languages: ["en"]
  preferred_source_types: ["news", "research", "company-announcement", "analyst-report"]
  focus_areas:
    - "AI model releases and capabilities"
    - "AI applied to supply chain and logistics"
    - "automation and robotics in operations"
    - "demand forecasting and inventory optimization"
    - "generative AI for procurement and sourcing"

output_dirs:
  research: outputs/research
  strategy: outputs/strategy
  drafts: outputs/drafts
  approved: outputs/approved
  published: outputs/published
  inputs: inputs/topics
